name: "Publish CI/CD"

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  configuration: Release
  solution: CronScheduler.sln

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      Version: ${{ steps.gitversion.outputs.semVer }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to fetch all history for all tags and branches

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Use GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Display GitVersion outputs
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}"

      - name: Restore dependencies
        run: dotnet restore ${{ env.solution }}

      - name: Build
        run: dotnet build ${{ env.solution }} -c ${{ env.configuration }} --no-restore -p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Test
        run: dotnet test ${{ env.solution }} -c ${{ env.configuration }} --no-build

      - name: Package
        run: dotnet pack ${{ env.solution }} -c ${{ env.configuration }} --no-build -p:PackageVersion=${{ steps.gitversion.outputs.semVer }} -o packages

      - name: Publish NuGet packages
        run: |
          dotnet nuget push "packages/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          if compgen -G "packages/*.snupkg" > /dev/null; then
            dotnet nuget push "packages/*.snupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          fi

  tag:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Display GitVersion outputs
        run: |
          echo "Version: ${{ needs.build.outputs.Version }}"
          echo "CommitsSinceVersionSource: ${{ needs.build.outputs.CommitsSinceVersionSource }}"

      - name: Create Tag and Release
        uses: softprops/action-gh-release@v3
        if: needs.build.outputs.CommitsSinceVersionSource > 0 # only create a release if there has been a commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build.outputs.Version }}
          name: Release ${{ needs.build.outputs.Version }}
          generate_release_notes: true
